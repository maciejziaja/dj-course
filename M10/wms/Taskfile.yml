version: "3"

tasks:
  setup:
    desc: Create .env from .env.example if .env does not exist
    cmds:
      - |
        if [ ! -f .env ]; then
          cp .env.example .env
          echo "Created .env from .env.example"
        fi

  generate-config:
    desc: Generate pgadmin/servers.json from .env
    cmds:
      - chmod +x scripts/generate-pgadmin-config.sh
      - ./scripts/generate-pgadmin-config.sh

  run-wms:
    desc: Run full WMS stack in Docker (postgres + api + pgadmin)
    # The contract gate, on the way to running anything. `contract-lint` needs no
    # server and no network, so it costs a second and it means the API cannot be
    # started against a contract that no longer describes it.
    deps: [contract-lint]
    cmds:
      - task: setup
      - task: generate-config
      - docker compose --profile full up -d --build

  run-wms-with-local-api:
    desc: Run postgres + pgadmin in Docker, wms-api locally
    deps: [contract-lint]
    cmds:
      - task: setup
      - task: generate-config
      - docker compose up -d
      - cd wms-api && ./run-local.sh

  setup-wms-api:
    desc: Create venv and install wms-api dependencies, including the contract tooling
    dir: wms-api
    cmds:
      - |
        # openapi-core needs >= 3.10; the Docker image is already python:3.13-slim.
        if [ ! -d .venv ]; then
          PY=$(command -v python3.13 || command -v python3.12 || command -v python3.11 \
               || command -v python3.10 || command -v python3)
          "$PY" -m venv .venv
          echo "📦 Created virtual environment with $("$PY" --version)"
        fi
      - |
        if ! .venv/bin/python -c 'import sys; sys.exit(0 if sys.version_info >= (3, 10) else 1)'; then
          echo "❌ wms-api/.venv runs $(.venv/bin/python --version), but openapi-core needs >= 3.10."
          echo "   Delete it and re-run:  rm -rf wms-api/.venv && task setup-wms-api"
          exit 1
        fi
      # `[dev]` brings pytest, openapi-spec-validator and schemathesis. The Docker
      # image installs the runtime dependencies only.
      #
      # `uv` if it is on the path (it is much faster, and a venv it created has no
      # pip of its own), otherwise the venv's own pip.
      - |
        if command -v uv >/dev/null 2>&1; then
          uv pip install --quiet --python .venv/bin/python -e ".[dev]"
        else
          .venv/bin/python -m pip install -q -e ".[dev]" --root-user-action=ignore
        fi
      - echo "✅ wms-api environment ready"

  run-only-local-api:
    desc: Run wms-api locally (requires postgres running, e.g. via run-wms-with-local-api)
    deps: [contract-lint]
    cmds:
      - task: setup
      - cd wms-api && ./run-local.sh

  generate-sql:
    desc: "Generate SQL WMS data files (usage: task generate-sql [MODE=SMALL|LARGE] [VERBOSE=TRUE|FALSE], default: MODE=SMALL, VERBOSE=FALSE)"
    dir: wms-data-generator
    cmds:
      - './generate.sh {{.MODE | default "SMALL"}} {{.VERBOSE | default "FALSE"}}'

  generate-sql-and-sync:
    desc: "Generate SQL and sync to postgres init-scripts (usage: task generate-sql-and-sync [MODE=SMALL|LARGE] [VERBOSE=TRUE|FALSE], default: MODE=SMALL, VERBOSE=FALSE)"
    dir: wms-data-generator
    cmds:
      - './generate-and-sync.sh {{.MODE | default "SMALL"}} {{.VERBOSE | default "FALSE"}}'

  # ==========================================================================
  # API contract
  #
  # `wms-api/openapi/` is the source of truth, split by resource so it can be
  # worked on. Two artefacts are generated from it and committed:
  #
  #   openapi.yaml            the assembled document every tool reads, including
  #                           src/openapi_guard.py at runtime
  #   src/contract/models.py  pydantic models the handlers and tests import
  #
  # Both can go stale, so nothing here trusts them: `contract-lint` regenerates
  # each one into memory and fails on any difference. That check runs before the
  # API starts (`run-wms`), before the tests and before the fuzzer - which is the
  # gate, in place of a CI server. The app itself carries the last one: it
  # refuses to start when the contract does not describe its own route table.
  # ==========================================================================

  contract:
    desc: "The full contract gate: lint, style, types, tests, docs"
    cmds:
      - task: contract-lint
      - task: contract-style
      - task: typecheck
      - task: contract-test
      - task: contract-docs

  contract-regen:
    desc: "Regenerate everything the contract produces: openapi.yaml, the models, the docs"
    cmds:
      - task: contract-bundle
      - task: contract-models
      - task: contract-docs

  contract-bundle:
    desc: Assemble wms-api/openapi/ into wms-api/openapi.yaml
    dir: wms-api
    deps: [setup-wms-api]
    cmds:
      - .venv/bin/python scripts/bundle_spec.py

  contract-models:
    desc: Regenerate src/contract/models.py from openapi.yaml
    dir: wms-api
    deps: [setup-wms-api]
    cmds:
      - .venv/bin/python scripts/generate_models.py

  contract-lint:
    desc: "The offline gate: artefacts current, spec valid, every route described"
    dir: wms-api
    deps: [setup-wms-api]
    cmds:
      # Three separate questions: are the generated artefacts current, is the
      # document valid OpenAPI, and does it still match the app.
      - .venv/bin/python scripts/bundle_spec.py --check
      - .venv/bin/python scripts/generate_models.py --check
      - .venv/bin/python scripts/lint_spec.py

  contract-style:
    desc: "Is it *good* OpenAPI? (Redocly's ruleset; needs npx)"
    dir: wms-api
    cmds:
      - npx --yes @redocly/cli@latest lint openapi.yaml

  typecheck:
    desc: Static type check of src, scripts and tests (mypy)
    dir: wms-api
    deps: [setup-wms-api]
    cmds:
      - .venv/bin/mypy

  contract-test:
    desc: Run the contract test suite (guard in strict mode - a drifted response fails)
    dir: wms-api
    deps: [contract-lint]
    cmds:
      - .venv/bin/python -m pytest {{.CLI_ARGS}}

  contract-docs:
    desc: Render openapi.yaml to a self-contained wms-api/docs/api.html
    dir: wms-api
    cmds:
      - mkdir -p docs
      - npx --yes @redocly/cli@latest build-docs openapi.yaml -o docs/api.html
      - echo "📖 wms-api/docs/api.html"

  contract-docs-open:
    desc: Render the contract and open it in a browser
    dir: wms-api
    cmds:
      - task: contract-docs
      - open docs/api.html || xdg-open docs/api.html

  contract-fuzz:
    desc: "Property-based contract testing against a running API (reads only; safe)"
    dir: wms-api
    deps: [contract-lint]
    preconditions:
      - sh: curl -sf -m 5 -o /dev/null {{.API_URL | default "http://localhost:3001"}}/health
        msg: "The API is not answering on {{.API_URL | default \"http://localhost:3001\"}} - start it with `task run-wms`."
    cmds:
      # GET only, so it can run against any environment without changing it.
      - .venv/bin/st run ./openapi.yaml --url {{.API_URL | default "http://localhost:3001"}} --include-method GET {{.CLI_ARGS}}

  contract-fuzz-all:
    desc: "Property-based testing of every operation - WRITES to the database (snapshotted and restored)"
    dir: wms-api
    deps: [contract-lint]
    vars:
      SNAPSHOT: '{{.SNAPSHOT | default ".fuzz-snapshot.sql"}}'
    preconditions:
      - sh: curl -sf -m 5 -o /dev/null {{.API_URL | default "http://localhost:3001"}}/health
        msg: "The API is not answering - start it with `task run-wms`."
      - sh: docker ps --format '{{`{{.Names}}`}}' | grep -q wms-postgres-container
        msg: "wms-postgres-container is not running; this task needs it to snapshot the database."
    cmds:
      # The generator sends valid writes as well as invalid ones, so it will
      # create and delete rows. Dump first, restore afterwards whatever happens.
      - docker exec wms-postgres-container pg_dump -U "${POSTGRES_USER:-admin}" -d "${POSTGRES_DB:-deliveroo}" --clean --if-exists > "{{.SNAPSHOT}}"
      - echo "💾 database snapshotted to wms-api/{{.SNAPSHOT}}"
      - defer: docker exec -i wms-postgres-container psql -q -U "${POSTGRES_USER:-admin}" -d "${POSTGRES_DB:-deliveroo}" < "{{.SNAPSHOT}}" > /dev/null && echo "♻️  database restored from the snapshot"
      - .venv/bin/st run ./openapi.yaml --url {{.API_URL | default "http://localhost:3001"}} {{.CLI_ARGS}}
