        '404':
          $ref: '#/components/responses/NotFound'
    post:
      summary: Create a single shelf
      operationId: createShelf
      tags: [Racks]
      parameters:
        - $ref: '#/components/parameters/RackId'
        - $ref: '#/components/parameters/XRequestId'
