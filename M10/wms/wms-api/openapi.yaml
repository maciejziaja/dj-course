        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ShelfCreate' }
      responses:
        '201':
          description: Shelf created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Shelf' }
        '400':
          $ref: '#/components/responses/InvalidBody'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /racks/{rack_id}/shelves:generate:
    post:
      summary: Generate shelves by level range
      operationId: generateShelves
      tags: [Racks]
      parameters:
        - $ref: '#/components/parameters/RackId'
        - $ref: '#/components/parameters/DryRun'
        - $ref: '#/components/parameters/XRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ShelfGenerate' }
      responses:
        '200':
          description: Dry run - nothing was written.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GenerateDryRun' }
        '201':
          description: Shelves created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShelvesGenerated' }
        '400':
          $ref: '#/components/responses/InvalidBody'
        '415':
