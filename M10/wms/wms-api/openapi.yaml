openapi: 3.0.3
info:
  title: WMS API (Warehouse Management System)
  description: |
    API for warehouse management.

    Two generations of endpoints live side by side and they do **not** share
    conventions - the contract documents both as they actually behave:

    * **Legacy** (`/employees`, `/contractors`, `/payments`, `/storage`,
      `/warehouse/{id}`) - bare arrays, no pagination, `{"error": "..."}` on
      failure, and timestamps rendered by Flask's default JSON encoder as
      **RFC 1123 HTTP dates** (`Wed, 11 Dec 2024 06:50:57 GMT`).
    * **Topology** (`/locations`, `/warehouses`, `/zones`, `/aisles`, `/racks`,
      `/shelves`) - paginated `{items, page, limit, total}` envelopes, a
      `{"error": <code>, "message": <text>, ...}` envelope on failure, and
      timestamps as **naive ISO-8601** (`2026-08-27T12:13:55.537725`, no offset).

    Neither timestamp rendering is RFC 3339, so neither is declared as
    `format: date-time`; both are pinned with an explicit `pattern` instead. See
    the `HttpDate` and `NaiveDateTime` schemas.

    This document is enforced at runtime by `openapi-core` (see
    `src/openapi_guard.py`): requests are validated before the handler runs and
    responses before they leave the process.
  version: 2.0.0

servers:
  - url: /
    description: Base API URL

tags:
  - name: Health
    description: Liveness and dependency status.
  - name: Employees
    description: Warehouse staff (legacy shape).
  - name: Contractors
    description: Contractor companies and their representatives (legacy shape).
  - name: Payments
    description: Payments against storage records (legacy shape).
  - name: Storage
    description: Cargo event history (legacy shape).
  - name: Locations
    description: Addresses a warehouse can be placed at.
  - name: Warehouses
    description: Root of the topology, plus the declarative layout endpoints.
  - name: Zones
    description: Zones and the aisles beneath them.
  - name: Aisles
    description: Aisles and the racks beneath them.
  - name: Racks
    description: Racks and the shelves beneath them.
  - name: Shelves
    description: The leaf level - flat catalogue, single-shelf CRUD and bulk patch.

paths:
  # ==========================================================================
  # Health
  # ==========================================================================
  /health:
    get:
      summary: Service health check
      description: Returns service status, uptime, version and dependency status (PostgreSQL).
      operationId: health
      tags: [Health]
      responses:
        '200':
          description: Service is running correctly.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthStatus' }
        '503':
          description: A dependency is down (e.g. PostgreSQL is unreachable).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthStatus' }

  # ==========================================================================
  # Storage (legacy)
  # ==========================================================================
  /storage/{record_id}/events:
    get:
      summary: Storage record event history
      description: Returns the cargo event history for the given storage record, oldest first.
      operationId: getStorageEventHistory
      tags: [Storage]
      parameters:
        - name: record_id
          in: path
          required: true
          description: Storage record ID (`storage_record_id`).
          schema: { type: integer, format: int32 }
      responses:
        '200':
          description: List of storage events (empty when the record has none).
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/StorageEvent' }
        '400':
          $ref: '#/components/responses/InvalidPath'
        '404':
          description: No endpoint matches this URL (the path parameter did not parse).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LegacyOrGuardError' }

  # ==========================================================================
  # Employees (legacy)
  # ==========================================================================
  /employees:
    get:
      summary: Employee list
      description: All employees with their contact details and comma-joined roles.
      operationId: getEmployees
      tags: [Employees]
      responses:
        '200':
          description: List of employees.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/EmployeeListItem' }

  /employees/{employee_id}:
    get:
      summary: Employee details
      description: A single employee, in the same shape as the list entry.
      operationId: getEmployee
      tags: [Employees]
      parameters:
        - name: employee_id
          in: path
          required: true
          description: Employee ID (`party_id`).
          schema: { type: integer, format: int32 }
      responses:
        '200':
          description: Employee data.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmployeeListItem' }
        '400':
          $ref: '#/components/responses/InvalidPath'
        '404':
          description: Employee not found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LegacyOrGuardError' }

  # ==========================================================================
  # Warehouse employees (legacy, singular - not the topology namespace)
  # ==========================================================================
  /warehouse/{warehouse_id}:
    get:
      summary: Warehouse employees
      description: |
        Employees assigned to the given warehouse.

        Note the singular path: this is a different namespace from the topology
        endpoints under `/warehouses` (plural).
      operationId: getWarehouseEmployees
      tags: [Employees]
      parameters:
        - name: warehouse_id
          in: path
          required: true
          description: Warehouse ID.
          schema: { type: integer, format: int32 }
      responses:
        '200':
          description: List of warehouse employees (empty when none are assigned).
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/EmployeeListItem' }
        '400':
          $ref: '#/components/responses/InvalidPath'
        '404':
          description: No endpoint matches this URL (the path parameter did not parse).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LegacyOrGuardError' }

  # ==========================================================================
  # Contractors (legacy)
  # ==========================================================================
  /contractors:
    get:
      summary: Contractor list
      description: Contractor companies with their contacts.
      operationId: getContractors
      tags: [Contractors]
      responses:
        '200':
          description: List of contractors.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ContractorSummary' }
        '500':
          description: A stored row failed the server-side pydantic validation.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LegacyOrGuardError' }

  /contractors/{id}:
    get:
      summary: Contractor details
      description: Full contractor record including addresses and representative employees.
      operationId: getContractorDetails
      tags: [Contractors]
      parameters:
        - $ref: '#/components/parameters/ContractorId'
      responses:
        '200':
          description: Contractor details.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContractorDetails' }
        '400':
          $ref: '#/components/responses/InvalidPath'
        '404':
          description: Contractor not found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LegacyOrGuardError' }
        '500':
          description: A stored row failed the server-side pydantic validation.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LegacyOrGuardError' }
    patch:
      summary: Update contractor status
      description: Sets the contractor status to `ACTIVE` or `INACTIVE`.
      operationId: updateContractorStatus
      tags: [Contractors]
      parameters:
        - $ref: '#/components/parameters/ContractorId'
        - $ref: '#/components/parameters/XRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContractorStatusUpdate' }
      responses:
        '200':
          description: Status updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContractorStatusUpdateResponse' }
        '400':
          description: Invalid request body.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LegacyOrGuardError' }
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '404':
          description: Contractor not found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LegacyOrGuardError' }

  # ==========================================================================
  # Payments (legacy)
  # ==========================================================================
  /payments:
    get:
      summary: Payment list
      description: Payments, optionally filtered by status and by paying party.
      operationId: getPaymentsList
      tags: [Payments]
      parameters:
        - name: status
          in: query
          required: false
          description: Exact-match filter on payment status.
          allowEmptyValue: true
          schema: { type: string, maxLength: 50, pattern: '^[^\u0000-\u001F\u007F]*$' }
        - name: party_id
          in: query
          required: false
          description: Exact-match filter on the paying party.
          schema: { type: integer, format: int32 }
      responses:
        '200':
          description: List of payments.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Payment' }
        '400':
          $ref: '#/components/responses/InvalidQuery'

  # ==========================================================================
  # Locations (topology)
  # ==========================================================================
  /locations:
    get:
      summary: List locations
      description: |
        The address picker behind `POST /warehouses`. A location has no children
        and nothing to cascade, so it is read-only here - one is created inline
        with a warehouse instead.
      operationId: getLocations
      tags: [Locations]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: city
          in: query
          description: Case-insensitive `ILIKE` filter on city.
          allowEmptyValue: true
          schema: { type: string, maxLength: 200, pattern: '^[^\u0000-\u001F\u007F]*$' }
        - name: country
          in: query
          description: Case-insensitive `ILIKE` filter on country.
          allowEmptyValue: true
          schema: { type: string, maxLength: 200, pattern: '^[^\u0000-\u001F\u007F]*$' }
        - name: q
          in: query
          description: Free-text `ILIKE` filter across address, city and postal code.
          allowEmptyValue: true
          schema: { type: string, maxLength: 200, pattern: '^[^\u0000-\u001F\u007F]*$' }
      responses:
        '200':
          description: A page of locations.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LocationPage' }
        '400':
          $ref: '#/components/responses/InvalidQuery'

  # ==========================================================================
  # Warehouses (topology)
  # ==========================================================================
  /warehouses:
    get:
      summary: List warehouses
      operationId: getWarehouses
      tags: [Warehouses]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: city
          in: query
          description: Case-insensitive `ILIKE` filter on the location's city.
          allowEmptyValue: true
          schema: { type: string, maxLength: 200, pattern: '^[^\u0000-\u001F\u007F]*$' }
        - name: country
          in: query
          description: Case-insensitive `ILIKE` filter on the location's country.
          allowEmptyValue: true
          schema: { type: string, maxLength: 200, pattern: '^[^\u0000-\u001F\u007F]*$' }
        - name: q
          in: query
          description: Free-text `ILIKE` filter on warehouse name and description.
          allowEmptyValue: true
          schema: { type: string, maxLength: 200, pattern: '^[^\u0000-\u001F\u007F]*$' }
      responses:
        '200':
          description: A page of warehouses.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WarehousePage' }
        '400':
          $ref: '#/components/responses/InvalidQuery'
    post:
      summary: Create a warehouse
      description: |
        Exactly one of `location_id` (an existing address) or `location` (a new
        one, created in the same transaction) must be supplied.
      operationId: createWarehouse
      tags: [Warehouses]
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WarehouseCreate' }
      responses:
        '201':
          description: Warehouse created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Warehouse' }
        '400':
          $ref: '#/components/responses/InvalidBody'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /warehouses/{warehouse_id}:
    get:
      summary: Get a warehouse
      operationId: getWarehouseDetails
      tags: [Warehouses]
      parameters:
        - $ref: '#/components/parameters/WarehouseId'
      responses:
        '200':
          description: The warehouse.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Warehouse' }
        '400':
          $ref: '#/components/responses/InvalidPath'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      summary: Update a warehouse
      description: Partial update - at least one field must be present in the body.
      operationId: updateWarehouse
      tags: [Warehouses]
      parameters:
        - $ref: '#/components/parameters/WarehouseId'
        - $ref: '#/components/parameters/XRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WarehousePatch' }
      responses:
        '200':
          description: The updated warehouse.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Warehouse' }
        '400':
          $ref: '#/components/responses/InvalidBody'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /warehouses/{warehouse_id}/zones:
    get:
      summary: List the zones of a warehouse
      operationId: getWarehouseZones
      tags: [Warehouses]
      parameters:
        - $ref: '#/components/parameters/WarehouseId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of zones.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ZonePage' }
        '400':
          $ref: '#/components/responses/InvalidQuery'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      summary: Create a zone
      operationId: createZone
      tags: [Warehouses]
      parameters:
        - $ref: '#/components/parameters/WarehouseId'
        - $ref: '#/components/parameters/XRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ZoneCreate' }
      responses:
        '201':
          description: Zone created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Zone' }
        '400':
          $ref: '#/components/responses/InvalidBody'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /warehouses/{warehouse_id}/layout:
    get:
      summary: Read the warehouse layout as a tree
      description: |
        Returns the topology of one warehouse, nested to the requested `depth`.
        Every node carries a `counts` object describing what sits beneath it, so
        a shallow read still reports the size of the subtree.
      operationId: getLayout
      tags: [Warehouses]
      parameters:
        - $ref: '#/components/parameters/WarehouseId'
        - name: depth
          in: query
          description: How far down to expand the tree. Nodes always carry `counts`.
          schema:
            type: string
            enum: [zone, aisle, rack, shelf]
            default: zone
      responses:
        '200':
          description: The layout tree.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Layout' }
        '400':
          $ref: '#/components/responses/InvalidQuery'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      summary: Create a whole layout in one call
      description: |
        Declarative bulk creation: zones, and optionally the aisles, racks and
        shelves beneath them, expanded from label ranges (`"01..08"`) or explicit
        lists. Everything is expanded and budget-checked before a single row is
        written, so a bad range costs nothing.

        With `?dry_run=true` nothing is written and the response reports what
        *would* have been created.
      operationId: createLayout
      tags: [Warehouses]
      parameters:
        - $ref: '#/components/parameters/WarehouseId'
        - $ref: '#/components/parameters/DryRun'
        - $ref: '#/components/parameters/XRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LayoutCreate' }
      responses:
        '200':
          description: Dry run - nothing was written.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LayoutDryRun' }
        '201':
          description: Layout created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LayoutCreated' }
        '400':
          $ref: '#/components/responses/InvalidBody'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  # ==========================================================================
  # Zones (topology)
  # ==========================================================================
  /zones/{zone_id}:
    get:
      summary: Get a zone
      operationId: getZone
      tags: [Zones]
      parameters:
        - $ref: '#/components/parameters/ZoneId'
      responses:
        '200':
          description: The zone.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Zone' }
        '400':
          $ref: '#/components/responses/InvalidPath'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      summary: Update a zone
      operationId: updateZone
      tags: [Zones]
      parameters:
        - $ref: '#/components/parameters/ZoneId'
        - $ref: '#/components/parameters/XRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ZonePatch' }
      responses:
        '200':
          description: The updated zone.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Zone' }
        '400':
          $ref: '#/components/responses/InvalidBody'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      summary: Delete a zone
      description: |
        Blocked with `409` when any shelf underneath carries a reservation or a
        storage record, and blocked with `409 has_children` when the zone still
        holds aisles and `?cascade=true` was not given.
      operationId: deleteZone
      tags: [Zones]
      parameters:
        - $ref: '#/components/parameters/ZoneId'
        - $ref: '#/components/parameters/Cascade'
        - $ref: '#/components/parameters/DryRun'
        - $ref: '#/components/parameters/XRequestId'
      responses:
        '200':
          description: Dry run - nothing was deleted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeleteDryRun' }
        '204':
          description: Deleted.
        '400':
          $ref: '#/components/responses/InvalidQuery'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/DeleteBlocked'

  /zones/{zone_id}/aisles:
    get:
      summary: List the aisles of a zone
      operationId: getZoneAisles
      tags: [Zones]
      parameters:
        - $ref: '#/components/parameters/ZoneId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of aisles.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AislePage' }
        '400':
          $ref: '#/components/responses/InvalidQuery'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      summary: Create a single aisle
      operationId: createAisle
      tags: [Zones]
      parameters:
        - $ref: '#/components/parameters/ZoneId'
        - $ref: '#/components/parameters/XRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AisleCreate' }
      responses:
        '201':
          description: Aisle created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Aisle' }
        '400':
          $ref: '#/components/responses/InvalidBody'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /zones/{zone_id}/aisles:generate:
    post:
      summary: Generate aisles by range
      description: |
        Creates a run of aisles from a label range or list, optionally with the
        racks and shelves underneath them in the same transaction.
      operationId: generateAisles
      tags: [Zones]
      parameters:
        - $ref: '#/components/parameters/ZoneId'
        - $ref: '#/components/parameters/DryRun'
        - $ref: '#/components/parameters/XRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AisleGenerate' }
      responses:
        '200':
          description: Dry run - nothing was written.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GenerateDryRun' }
        '201':
          description: Aisles created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AislesGenerated' }
        '400':
          $ref: '#/components/responses/InvalidBody'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  # ==========================================================================
  # Aisles (topology)
  # ==========================================================================
  /aisles/{aisle_id}:
    get:
      summary: Get an aisle
      operationId: getAisle
      tags: [Aisles]
      parameters:
        - $ref: '#/components/parameters/AisleId'
      responses:
        '200':
          description: The aisle.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Aisle' }
        '400':
          $ref: '#/components/responses/InvalidPath'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      summary: Update an aisle
      operationId: updateAisle
      tags: [Aisles]
      parameters:
        - $ref: '#/components/parameters/AisleId'
        - $ref: '#/components/parameters/XRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AislePatch' }
      responses:
        '200':
          description: The updated aisle.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Aisle' }
        '400':
          $ref: '#/components/responses/InvalidBody'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      summary: Delete an aisle
      operationId: deleteAisle
      tags: [Aisles]
      parameters:
        - $ref: '#/components/parameters/AisleId'
        - $ref: '#/components/parameters/Cascade'
        - $ref: '#/components/parameters/DryRun'
        - $ref: '#/components/parameters/XRequestId'
      responses:
        '200':
          description: Dry run - nothing was deleted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeleteDryRun' }
        '204':
          description: Deleted.
        '400':
          $ref: '#/components/responses/InvalidQuery'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/DeleteBlocked'

  /aisles/{aisle_id}/racks:
    get:
      summary: List the racks of an aisle
      operationId: getAisleRacks
      tags: [Aisles]
      parameters:
        - $ref: '#/components/parameters/AisleId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of racks.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RackPage' }
        '400':
          $ref: '#/components/responses/InvalidQuery'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      summary: Create a single rack
      operationId: createRack
      tags: [Aisles]
      parameters:
        - $ref: '#/components/parameters/AisleId'
        - $ref: '#/components/parameters/XRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RackCreate' }
      responses:
        '201':
          description: Rack created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Rack' }
        '400':
          $ref: '#/components/responses/InvalidBody'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /aisles/{aisle_id}/racks:generate:
    post:
      summary: Generate racks by range
      operationId: generateRacks
      tags: [Aisles]
      parameters:
        - $ref: '#/components/parameters/AisleId'
        - $ref: '#/components/parameters/DryRun'
        - $ref: '#/components/parameters/XRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RackGenerate' }
      responses:
        '200':
          description: Dry run - nothing was written.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GenerateDryRun' }
        '201':
          description: Racks created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RacksGenerated' }
        '400':
          $ref: '#/components/responses/InvalidBody'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  # ==========================================================================
  # Racks (topology)
  # ==========================================================================
  /racks/{rack_id}:
    get:
      summary: Get a rack
      operationId: getRack
      tags: [Racks]
      parameters:
        - $ref: '#/components/parameters/RackId'
      responses:
        '200':
          description: The rack.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Rack' }
        '400':
          $ref: '#/components/responses/InvalidPath'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      summary: Update a rack
      operationId: updateRack
      tags: [Racks]
      parameters:
        - $ref: '#/components/parameters/RackId'
        - $ref: '#/components/parameters/XRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RackPatch' }
      responses:
        '200':
          description: The updated rack.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Rack' }
        '400':
          $ref: '#/components/responses/InvalidBody'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      summary: Delete a rack
      operationId: deleteRack
      tags: [Racks]
      parameters:
        - $ref: '#/components/parameters/RackId'
        - $ref: '#/components/parameters/Cascade'
        - $ref: '#/components/parameters/DryRun'
        - $ref: '#/components/parameters/XRequestId'
      responses:
        '200':
          description: Dry run - nothing was deleted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeleteDryRun' }
        '204':
          description: Deleted.
        '400':
          $ref: '#/components/responses/InvalidQuery'
        '404':
