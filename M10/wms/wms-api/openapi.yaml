  /racks/{rack_id}/shelves:
    get:
      summary: List the shelves of a rack
      operationId: getRackShelves
      tags: [Racks]
      parameters:
        - $ref: '#/components/parameters/RackId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
