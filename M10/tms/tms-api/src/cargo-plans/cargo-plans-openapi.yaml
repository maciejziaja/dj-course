# Cargo Load Plans – paths and schemas
paths:
  /cargo-plans:
    post:
      summary: Create a load plan
      description: Creates a new cargo load plan for a given load space class – either a detachable trailer or a class of rigid vehicles.
      operationId: createLoadPlan
      tags:
        - CargoPlans
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLoadPlanInput'
            example:
              loadSpaceType: standard-curtainside
      responses:
        '201':
          description: Load plan created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateLoadPlanResponse'
              example:
                id: a1b2c3d4-e5f6-7890-abcd-ef1234567890
        '400':
          description: Missing or unknown loadSpaceType.
          content:
            application/json:
              schema:
                $ref: '../../contract/entry.yaml#/components/schemas/ErrorResponse'
              example:
                error: "body.loadSpaceType: Invalid option: expected one of \"standard-curtainside\"|\"mega\"|\"reefer\"|\"van-medium\"|\"box-truck-8t\""
        '500':
          $ref: '../../contract/entry.yaml#/components/responses/InternalServerError'

  /cargo-plans/{id}:
    get:
      summary: Get load plan details
      description: Returns the full state of a load plan including assigned cargo units.
      operationId: getLoadPlan
      tags:
        - CargoPlans
      parameters:
        - $ref: '#/components/parameters/LoadPlanIdParam'
        - $ref: '#/components/parameters/WeightUnitParam'
      responses:
        '200':
          description: Load plan found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CargoLoadPlanReadModel'
              example:
                id: a1b2c3d4-e5f6-7890-abcd-ef1234567890
                status: DRAFT
                weightUnit: KG
                loadSpace:
                  type: standard-curtainside
                  label: Standard Curtainside
                  kind: TRAILER
                  canCarryPallets: true
                  maxWeightCapacityKg: 24000
                  widthMm: 2480
                  heightMm: 2700
                  maxLdm: 13.6
                  capabilities:
                    hasClimateControl: false
                    supportsSideLoading: true
                    hasHighSecurityLock: false
                    isBulkReady: false
                version: 3
                currentLdm: 2.4
                plannedWeight: 600
                plannedGrossWeight: 625
                units:
                  - id: b2c3d4e5-f6a7-8901-bcde-f12345678901
                    palletLabel: EPAL 1
                    cargoType: FOOD
                    weight: 600
                    totalHeightMm: 1400
                    requirements:
                      isTemperatureControlled: false
                      requiresSideLoading: false
                      isBulk: false
                      highSecurityRequired: false
        '400':
          description: Malformed load plan id or unsupported query parameter.
          content:
            application/json:
              schema:
                $ref: '../../contract/entry.yaml#/components/schemas/ErrorResponse'
              example:
                error: "query.weightUnit: Invalid option: expected one of \"KG\"|\"TONNE\"|\"LB\""
        '404':
          description: No load plan exists with the given ID.
          content:
            application/json:
              schema:
                $ref: '../../contract/entry.yaml#/components/schemas/ErrorResponse'
              example:
                error: "Load plan 'a1b2c3d4-...' not found"
        '500':
          $ref: '../../contract/entry.yaml#/components/responses/InternalServerError'

  /cargo-plans/{id}/cargo:
    post:
      summary: Add cargo to a load plan
      description: Adds a pallet unit with cargo to an existing draft load plan.
      operationId: addCargoToLoadPlan
      tags:
        - CargoPlans
      parameters:
        - $ref: '#/components/parameters/LoadPlanIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddCargoInput'
            example:
              palletType: epal1
              cargoType: FOOD
              weightKg: 600
              cargoHeightMm: 1200
      responses:
        '204':
          description: Cargo added successfully – no body returned.
        '400':
          description: Request payload does not match the contract (unknown pallet or cargo type, non-positive weight or height, malformed id).
          content:
            application/json:
              schema:
                $ref: '../../contract/entry.yaml#/components/schemas/ErrorResponse'
              example:
                error: "body.weightKg: Too small: expected number to be >0"
        '404':
          description: No load plan exists with the given ID.
          content:
            application/json:
              schema:
                $ref: '../../contract/entry.yaml#/components/schemas/ErrorResponse'
              example:
                error: "Load plan 'a1b2c3d4-...' not found"
        '409':
          description: >-
            The plan cannot accept the cargo in its current state: it is already
            finalized, the cargo cannot be co-loaded with what is already on the
            plan, or a concurrent modification won the optimistic lock.
          content:
            application/json:
              schema:
                $ref: '../../contract/entry.yaml#/components/schemas/ErrorResponse'
              example:
                error: "Incompatible cargo: Cannot mix Food with Dangerous goods."
        '422':
          description: >-
            The payload is well-formed but violates a planning rule: load space
            weight capacity or vehicle payload exceeded, loading metres exceeded,
            cargo too tall or too wide, a capability the load space lacks, or a
            pallet that cannot carry this cargo type or weight.
          content:
            application/json:
              schema:
                $ref: '../../contract/entry.yaml#/components/schemas/ErrorResponse'
              example:
                error: "Vehicle payload exceeded: Medium Van cannot carry 1615kg gross (payload 1400kg + 200kg tolerance)."
        '500':
          $ref: '../../contract/entry.yaml#/components/responses/InternalServerError'

  /cargo-plans/{id}/cargo/{unitId}:
    delete:
      summary: Remove cargo from a load plan
      description: Removes a specific pallet unit from a draft load plan by its unit ID.
      operationId: removeCargoFromLoadPlan
      tags:
        - CargoPlans
      parameters:
        - $ref: '#/components/parameters/LoadPlanIdParam'
        - name: unitId
          in: path
          description: UUID of the pallet unit to remove
          required: true
          schema:
            type: string
            format: uuid
          example: b2c3d4e5-f6a7-8901-bcde-f12345678901
      responses:
        '204':
          description: Cargo removed successfully – no body returned.
        '400':
          description: Malformed load plan or unit id.
          content:
            application/json:
              schema:
                $ref: '../../contract/entry.yaml#/components/schemas/ErrorResponse'
              example:
                error: "params.unitId: Invalid UUID"
        '404':
          description: No load plan exists with the given ID, or the plan carries no unit with that ID.
          content:
            application/json:
              schema:
                $ref: '../../contract/entry.yaml#/components/schemas/ErrorResponse'
              example:
                error: "Load plan 'a1b2c3d4-...' not found"
        '409':
          description: The plan is already finalized, or a concurrent modification won the optimistic lock.
          content:
            application/json:
              schema:
                $ref: '../../contract/entry.yaml#/components/schemas/ErrorResponse'
              example:
                error: Finalized plan cannot be modified.
        '500':
          $ref: '../../contract/entry.yaml#/components/responses/InternalServerError'

  /cargo-plans/{id}/load-space:
    put:
      summary: Change load space
      description: >-
        Replaces the load space class on a draft load plan. All currently
        assigned cargo units are re-validated against the new class's
        capabilities and capacity. Switching between a trailer and a rigid
        vehicle class is allowed and will additionally apply (or drop) the
        vehicle payload rule.
      operationId: changeLoadSpace
      tags:
        - CargoPlans
      parameters:
        - $ref: '#/components/parameters/LoadPlanIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeLoadSpaceInput'
            example:
              loadSpaceType: van-medium
      responses:
        '204':
          description: Load space changed successfully – no body returned.
        '400':
          description: Missing or unknown loadSpaceType, or malformed load plan id.
          content:
            application/json:
              schema:
                $ref: '../../contract/entry.yaml#/components/schemas/ErrorResponse'
              example:
                error: "body.loadSpaceType: Invalid option: expected one of \"standard-curtainside\"|\"mega\"|\"reefer\"|\"van-medium\"|\"box-truck-8t\""
        '404':
          description: No load plan exists with the given ID.
          content:
            application/json:
              schema:
                $ref: '../../contract/entry.yaml#/components/schemas/ErrorResponse'
              example:
                error: "Load plan 'a1b2c3d4-...' not found"
        '409':
          description: >-
            The plan is already finalized, the cargo on it cannot be co-loaded,
            or a concurrent modification won the optimistic lock.
          content:
            application/json:
              schema:
                $ref: '../../contract/entry.yaml#/components/schemas/ErrorResponse'
              example:
                error: Finalized plan cannot be modified.
        '422':
          description: >-
            Cargo already on the plan does not fit the new load space – its
            capacity, payload, loading metres, dimensions or capabilities are
            not enough for what is loaded.
          content:
            application/json:
              schema:
                $ref: '../../contract/entry.yaml#/components/schemas/ErrorResponse'
              example:
                error: "Load space capability mismatch: high security lock required"
        '500':
          $ref: '../../contract/entry.yaml#/components/responses/InternalServerError'

  /cargo-plans/{id}/finalize:
    post:
      summary: Finalize a load plan
      description: Marks the load plan as FINALIZED. A finalized plan cannot be modified. The plan must have at least one cargo unit and must not exceed load space capacity.
      operationId: finalizeLoadPlan
      tags:
        - CargoPlans
      parameters:
        - $ref: '#/components/parameters/LoadPlanIdParam'
      responses:
        '204':
          description: Load plan finalized successfully – no body returned.
        '400':
          description: Malformed load plan id.
          content:
            application/json:
              schema:
                $ref: '../../contract/entry.yaml#/components/schemas/ErrorResponse'
              example:
                error: "params.id: Invalid UUID"
        '404':
          description: No load plan exists with the given ID.
          content:
            application/json:
              schema:
                $ref: '../../contract/entry.yaml#/components/schemas/ErrorResponse'
              example:
                error: "Load plan 'a1b2c3d4-...' not found"
        '409':
          description: The plan is already finalized, or a concurrent modification won the optimistic lock.
          content:
            application/json:
              schema:
                $ref: '../../contract/entry.yaml#/components/schemas/ErrorResponse'
              example:
                error: Finalized plan cannot be modified.
        '422':
          description: The plan cannot be finalized – it carries no cargo, or it exceeds the load space's loading metres.
          content:
            application/json:
              schema:
                $ref: '../../contract/entry.yaml#/components/schemas/ErrorResponse'
              example:
                error: Cannot finalize empty plan.
        '500':
          $ref: '../../contract/entry.yaml#/components/responses/InternalServerError'

components:
  parameters:
    LoadPlanIdParam:
      name: id
      in: path
      description: UUID of the load plan
      required: true
      schema:
        type: string
        format: uuid
      example: a1b2c3d4-e5f6-7890-abcd-ef1234567890

    WeightUnitParam:
      name: weightUnit
      in: query
      description: Unit in which weight values are expressed in the response. Defaults to KG.
      required: false
      schema:
        $ref: '#/components/schemas/WeightUnit'

  schemas:
    WeightUnit:
      type: string
      description: Unit of weight measurement
      enum:
        - KG
        - TONNE
        - LB
      default: KG
    LoadSpaceType:
      type: string
      description: >-
        Supported load space classes. Planning always commits to a class, never
        to a make and model.

        The first three are detachable trailers: the tractor unit is reserved
        later, so no payload can be checked yet. The rest are rigid vehicle
        classes, where the class determines the vehicle well enough to answer
        "can it carry this?" while planning — every figure such a class reports
        is the guaranteed minimum across the models in `fitsVehicles`.
      enum:
        - standard-curtainside
        - mega
        - reefer
        - van-medium
        - box-truck-8t

    LoadSpaceKind:
      type: string
      description: Whether the load space is detachable from its vehicle.
      enum:
        - TRAILER
        - RIGID_VEHICLE

    PalletType:
      type: string
      description: Supported pallet types
      enum:
        - epal1
        - industrial
        - half
        - cp1
        - cp3
        - h1

    CargoType:
      type: string
      description: Type of cargo being transported
      enum:
        - FOOD
        - CHEMICAL
        - ELECTRONICS
        - ADR
        - GENERAL

    CargoLoadPlanStatus:
      type: string
      description: Current status of the load plan
      enum:
        - DRAFT
        - FINALIZED

    CargoRequirementsInput:
      type: object
      description: Special handling requirements for a cargo unit.
      required:
        - isTemperatureControlled
        - requiresSideLoading
        - isBulk
        - highSecurityRequired
      properties:
        isTemperatureControlled:
          type: boolean
          description: Cargo requires a climate-controlled load space
          example: false
        requiresSideLoading:
          type: boolean
          description: Cargo must be loaded from the side
          example: false
        isBulk:
          type: boolean
          description: Cargo is bulk (requires bulk-ready load space)
          example: false
        highSecurityRequired:
          type: boolean
          description: Cargo requires high-security locking
          example: false

    LoadSpaceCapabilities:
      type: object
      description: Capabilities of the assigned load space.
      required:
        - hasClimateControl
        - supportsSideLoading
        - hasHighSecurityLock
        - isBulkReady
      properties:
        hasClimateControl:
          type: boolean
          description: Load space has temperature/climate control
          example: false
        supportsSideLoading:
          type: boolean
          description: Load space supports side loading
          example: true
        hasHighSecurityLock:
          type: boolean
          description: Load space has high-security locking
          example: false
        isBulkReady:
          type: boolean
          description: Load space supports bulk cargo
          example: false

    LoadSpaceReadModel:
      type: object
      description: Details of the load space assigned to the load plan.
      required:
        - type
        - label
        - kind
        - canCarryPallets
        - maxWeightCapacityKg
        - widthMm
        - heightMm
        - maxLdm
        - capabilities
      properties:
        type:
          $ref: '#/components/schemas/LoadSpaceType'
        label:
          type: string
          description: Human-readable name of the load space class
          example: Standard Curtainside
        kind:
          $ref: '#/components/schemas/LoadSpaceKind'
        canCarryPallets:
          type: boolean
          example: true
        maxWeightCapacityKg:
          type: number
          description: Structural weight capacity of the load floor, in kilograms
          example: 24000
        payloadCapacityKg:
          type: number
          description: >-
            Lowest legal payload in the class, in kilograms, counted against
            gross weight (cargo plus pallets). Present only when kind is
            RIGID_VEHICLE – a trailer's payload depends on the tractor unit,
            which is not known at planning time. Planning tolerates a gross
            load of up to 200 kg over this figure.
          example: 1400
        fitsVehicles:
          type: array
          description: >-
            Concrete vehicle models that can honour a plan made against this
            class. Every dimension and limit reported here is the worst case
            across them, so dispatch may send whichever is free. Present only
            when kind is RIGID_VEHICLE.
          items:
            type: string
          example:
            - Fiat Ducato L2H2
            - Renault Master L2H2
        widthMm:
          type: integer
          description: >-
            Usable width for pallets in millimetres. For rigid vehicles this is
            the narrowest span between the wheel arches in the class, not the
            widest point of any body.
          example: 2480
        heightMm:
          type: integer
          description: Internal load space height in millimetres
          example: 2700
        maxLdm:
          type: number
          description: >-
            Maximum loading length in metres. For trailers this is LDM in the
            road-freight sense; for rigid vehicles, simply usable floor length.
          example: 13.6
        capabilities:
          $ref: '#/components/schemas/LoadSpaceCapabilities'

    PalletUnitReadModel:
      type: object
      description: A single pallet unit assigned to a load plan.
      required:
        - id
        - palletLabel
        - cargoType
        - weight
        - totalHeightMm
        - requirements
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier of the pallet unit
          example: b2c3d4e5-f6a7-8901-bcde-f12345678901
        palletLabel:
          type: string
          description: Human-readable label of the pallet spec (e.g. "EPAL 1")
          example: EPAL 1
        cargoType:
          $ref: '#/components/schemas/CargoType'
        weight:
          type: number
          description: Weight of the cargo on this pallet, expressed in the unit specified by the weightUnit field on the parent CargoLoadPlanReadModel
          minimum: 0
          exclusiveMinimum: true
          example: 600
        totalHeightMm:
          type: integer
          description: Total height of pallet + cargo in millimetres
          minimum: 0
          exclusiveMinimum: true
          example: 1400
        description:
          type: string
          nullable: true
          description: Human-readable product description (e.g. "FOOD – warzywa")
        requirements:
          $ref: '#/components/schemas/CargoRequirementsInput'

    CargoLoadPlanReadModel:
      type: object
      description: Full state of a cargo load plan.
      required:
        - id
        - status
        - version
        - weightUnit
        - loadSpace
        - currentLdm
        - plannedWeight
        - plannedGrossWeight
        - units
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier of the load plan
          example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
        status:
          $ref: '#/components/schemas/CargoLoadPlanStatus'
        version:
          type: integer
          description: Optimistic concurrency version of the load plan
          minimum: 0
          example: 3
        weightUnit:
          $ref: '#/components/schemas/WeightUnit'
        loadSpace:
          $ref: '#/components/schemas/LoadSpaceReadModel'
        currentLdm:
          type: number
          description: Currently used loading metres
          minimum: 0
          example: 2.4
        plannedWeight:
          type: number
          description: Total weight of the cargo alone, expressed in the unit given by weightUnit
          minimum: 0
          example: 600
        plannedGrossWeight:
          type: number
          description: >-
            Total weight of the cargo *plus* the pallets carrying it, expressed
            in the unit given by weightUnit. This is the figure capacity and
            vehicle payload limits are judged against.
          minimum: 0
          example: 625
        units:
          type: array
          description: Cargo units assigned to this plan
          items:
            $ref: '#/components/schemas/PalletUnitReadModel'

    CreateLoadPlanInput:
      type: object
      additionalProperties: false
      description: Payload for creating a new load plan.
      required:
        - loadSpaceType
      properties:
        loadSpaceType:
          $ref: '#/components/schemas/LoadSpaceType'

    CreateLoadPlanResponse:
      type: object
      description: Identifier of the newly created load plan.
      required:
        - id
      properties:
        id:
          type: string
          format: uuid
          description: UUID of the created load plan
          example: a1b2c3d4-e5f6-7890-abcd-ef1234567890

    AddCargoInput:
      type: object
      additionalProperties: false
      description: Payload for adding a cargo unit to a load plan.
      required:
        - palletType
        - cargoType
        - weightKg
        - cargoHeightMm
      properties:
        palletType:
          $ref: '#/components/schemas/PalletType'
        cargoType:
          $ref: '#/components/schemas/CargoType'
        weightKg:
          type: number
          description: Weight of the cargo in kilograms
          minimum: 0
          exclusiveMinimum: true
          example: 600
        cargoHeightMm:
          type: integer
          description: Height of the cargo (without pallet) in millimetres
          minimum: 0
          exclusiveMinimum: true
          example: 1200

    ChangeLoadSpaceInput:
      type: object
      additionalProperties: false
      description: Payload for changing the load space on a load plan.
      required:
        - loadSpaceType
      properties:
        loadSpaceType:
          $ref: '#/components/schemas/LoadSpaceType'
