services:
  # ============ Docker Registry ============
  registry:
    image: registry:2
    container_name: deliveroo-registry
    ports:
      - "5001:5000"
    environment:
      # Wymagane, aby UI mogło usuwać/odpytywać + obsługa CORS
      REGISTRY_HTTP_HEADERS_Access-Control-Allow-Origin: "[http://localhost:8080]"
      REGISTRY_HTTP_HEADERS_Access-Control-Allow-Methods: "[HEAD,GET,OPTIONS,DELETE]"
      REGISTRY_HTTP_HEADERS_Access-Control-Allow-Credentials: "[true]"
      REGISTRY_HTTP_HEADERS_Access-Control-Allow-Headers: "[Authorization,Accept,Cache-Control]"
      REGISTRY_HTTP_HEADERS_Access-Control-Expose-Headers: "[Docker-Content-Digest]"
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
    volumes:
      - registry_data:/var/lib/registry
    restart: unless-stopped

  # ============ Registry UI ============
  registry-ui:
    image: joxit/docker-registry-ui:main
    container_name: deliveroo-registry-ui
    ports:
      - "8080:80"
    environment:
      SINGLE_REGISTRY: "true"
      REGISTRY_TITLE: "Deliveroo Registry"
      NGINX_PROXY_PASS_URL: "http://registry:5000"
      DELETE_IMAGES: "true"
      SHOW_CONTENT_DIGEST: "true"
    depends_on:
      - registry
    restart: unless-stopped

volumes:
  registry_data: