services:
  wms-postgres:
    image: postgres:17-alpine
    container_name: wms-postgres-container
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: strongpassword123
      POSTGRES_DB: deliveroo
    ports:
      - "5432:5432"
    volumes:
      - wms-postgres_data:/var/lib/postgresql/data
      - ./postgres/init-scripts:/docker-entrypoint-initdb.d
    networks:
      - deliveroo-network
    restart: unless-stopped

  # --- WERSJA DEVELOPERSKA -------------------------------------------------
  # Uruchamiana profilem `dev`. Wbudowany serwer Flaska + hot-reload (watch).
  # Alias sieciowy `wms-api` sprawia, że nginx (proxy_pass http://wms-api:3001)
  # działa niezależnie od tego, czy aktywny jest profil dev czy prod.
  wms-api-dev:
    container_name: wms-api-dev-container
    profiles: ["dev"]
    build:
      context: ./wms-api
      dockerfile: Dockerfile
      target: dev
    environment:
      - PORT=3001
      - SERVICE_NAME=wms-api
      - POSTGRES_URL=postgresql+psycopg2://admin:strongpassword123@wms-postgres:5432/deliveroo
    ports:
      - "3001:3001"
    networks:
      deliveroo-network:
        aliases:
          - wms-api
    develop:
      watch:
        - action: sync+restart
          path: ./wms-api/src
          target: /app/src
        - action: rebuild
          path: ./wms-api/requirements.txt

  # --- WERSJA PRODUKCYJNA --------------------------------------------------
  # Uruchamiana profilem `prod`. Produkcyjny serwer WSGI Gunicorn (4 workery).
  # Brak `watch` - kod jest "zapieczony" w obrazie. Restart automatyczny.
  wms-api-prod:
    container_name: wms-api-prod-container
    profiles: ["prod"]
    build:
      context: ./wms-api
      dockerfile: Dockerfile
      target: prod
    environment:
      - PORT=3001
      - SERVICE_NAME=wms-api
      - GUNICORN_WORKERS=4
      - POSTGRES_URL=postgresql+psycopg2://admin:strongpassword123@wms-postgres:5432/deliveroo
    ports:
      - "3001:3001"
    networks:
      deliveroo-network:
        aliases:
          - wms-api
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: nginx-container
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - deliveroo-network
    # Brak depends_on: serwis API (dev lub prod) zależy od aktywnego profilu,
    # więc twarda zależność powodowałaby błąd przy starcie pojedynczego profilu.
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:9.4
    container_name: pgadmin-container
    environment:
      PGADMIN_DEFAULT_EMAIL: pgadmin@example.com
      PGADMIN_DEFAULT_PASSWORD: pgadmin_password
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json
    networks:
      - deliveroo-network
    depends_on:
      - wms-postgres
    restart: unless-stopped

networks:
  deliveroo-network:
    driver: bridge

volumes:
  wms-postgres_data:
  pgadmin_data:
