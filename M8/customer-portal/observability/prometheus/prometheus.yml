global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Nuxt app - @artmizu/nuxt-prometheus wystawia /metrics na porcie aplikacji
  - job_name: 'cp-app'
    metrics_path: /metrics
    static_configs:
      - targets: ['cp:3000']
        labels:
          service: 'customer-portal'

  # Metryki maszyny (CPU, RAM, dysk, sieć)
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  # Standardowy monitoring MongoDB
  - job_name: 'mongodb'
    static_configs:
      - targets: ['mongodb-exporter:9216']
        labels:
          service: 'cp-mongodb'
